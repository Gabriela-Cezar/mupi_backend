<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Editar tema</title>
    <link rel="stylesheet" href="/admin-static/style.css">
</head>

<body>

{% include "admin/_admin_header.html" %}

<div class="container">

    <p><a href="/admin/themes">← Voltar para os temas</a></p>

    <h1>Editar tema</h1>

    {% include "admin/_messages.html" %}

    <form action="/admin/themes/{{ theme_id }}/edit" method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="name">Nome</label>
            <input
                type="text"
                id="name"
                name="name"
                maxlength="100"
                value="{{ draft.name }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="description">Descrição (opcional)</label>
            <textarea id="description" name="description" rows="3">{{ draft.description }}</textarea>
        </div>

        <button type="submit">Salvar alterações</button>

    </form>

</div>

</body>

</html>
