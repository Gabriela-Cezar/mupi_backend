<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Testar E-mail</title>
    <link rel="stylesheet" href="/admin-static/style.css">
</head>

<body>

{% include "admin/_admin_header.html" %}

<div class="container">

    <h1>Testar E-mail</h1>

    <p>
        Envia um e-mail de teste pelo Resend para conferir se a configuração
        de envio (usada nos códigos de cadastro e de recuperação de senha)
        está funcionando.
    </p>

    {% if success %}
        <div class="alert-success" role="status">{{ success }}</div>
    {% endif %}

    {% if error %}
        <div class="alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form action="/admin/email-test" method="post">

        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="recipient">Enviar para</label>
            <input
                type="email"
                id="recipient"
                name="recipient"
                value="{{ recipient }}"
                required
            >
        </div>

        <button type="submit">Enviar e-mail de teste</button>

    </form>

</div>

</body>

</html>
