# S3 local para o desenvolvimento (MinIO). Só desenvolvimento: em produção
# o backend usa o provedor real (ver infra/aws/).
#
# Rodar na raiz do backend, lendo as credenciais do .env do backend:
#   docker compose --env-file .env -f infra/minio/docker-compose.yml up -d
#
# O usuário e a senha do MinIO são o AWS_ACCESS_KEY_ID e o
# AWS_SECRET_ACCESS_KEY do .env: o backend entra com as mesmas chaves.
name: mupi-dev

services:
  minio:
    # A MinIO parou de publicar imagens da edição comunitária em out/2025:
    # versão fixa, a última publicada.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?defina AWS_ACCESS_KEY_ID no .env}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?defina AWS_SECRET_ACCESS_KEY no .env}
      # Mesma região do .env: a assinatura dos links inclui a região
      MINIO_REGION: ${AWS_REGION:-sa-east-1}
    ports:
      - "9000:9000"   # API S3 (links assinados)
      - "9001:9001"   # console web: http://localhost:9001
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  # Os arquivos sobrevivem a "docker compose down" (só "down -v" apaga)
  minio-data:
